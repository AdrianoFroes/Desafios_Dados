version: "3.9"

services:
  openmetadata-postgres:
    image: postgres:15-alpine
    container_name: om_postgres
    environment:
      POSTGRES_USER: openmetadata
      POSTGRES_PASSWORD: openmetadata_password
      POSTGRES_DB: openmetadata_db
    volumes:
      - om_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped

  openmetadata-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: om_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - om_es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  openmetadata-server:
    image: openmetadata/server:1.3.1
    container_name: om_server
    ports:
      - "8585:8585"
    environment:
      - DB_HOST=openmetadata-postgres
      - DB_PORT=5432
      - DB_USER=openmetadata
      - DB_PASSWORD=openmetadata_password
      - DB_SCHEMA=openmetadata_db
      - ELASTICSEARCH_HOST=openmetadata-elasticsearch
      - ELASTICSEARCH_PORT=9200
      - OPENMETADATA_CLUSTER_NAME=openmetadata
      - SERVER_PORT=8585
    depends_on:
      - openmetadata-postgres
      - openmetadata-elasticsearch
    restart: unless-stopped

volumes:
  om_postgres_data:
  om_es_data:
