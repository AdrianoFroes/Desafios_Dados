services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: desafio_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_educacional}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: desafio_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  superset:
    image: apache/superset:3.1.1
    container_name: desafio_superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "desafio_dados_fic_dev_secret_key_2026_super_safe"
      SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
      TALISMAN_ENABLED: "False"
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
      - ./dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./src/setup_superset_internal.py:/app/setup_superset_internal.py:ro
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname FICDEV --email admin@ficdev.local --password admin || true &&
      superset init &&
      python /app/setup_superset_internal.py || true &&
      /usr/bin/run-server.sh
      "
    depends_on:
      - postgres
    restart: unless-stopped

  apresentacao:
    image: nginx:alpine
    container_name: desafio_apresentacao
    ports:
      - "8085:80"
    volumes:
      - .:/usr/share/nginx/html:ro
    restart: unless-stopped

  apache_hop:
    image: apache/hop-web:2.19.0
    container_name: desafio_apache_hop
    ports:
      - "8086:8080"
    environment:
      HOP_CONFIG_FOLDER: /hop/config
      HOP_AUDIT_FOLDER: /hop/audit
      HOP_PROJECT_NAME: plataforma
      HOP_PROJECT_FOLDER: /hop/projects/plataforma
      HOP_ENVIRONMENT_NAME: docker
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /hop/projects/plataforma/docker-env.json
      HOP_SHARED_JDBC_FOLDERS: /usr/local/tomcat/jdbc-drivers
      HOP_WEB_SECURITY_MODE: BASIC
      HOP_WEB_ADMIN_USER: admin
      HOP_WEB_ADMIN_PASSWORD: ${HOP_WEB_ADMIN_PASSWORD:-admin}
    volumes:
      - hop_config:/hop/config
      - hop_audit:/hop/audit
      - ./hop:/hop/projects
      - ./dados:/dados:ro
    depends_on:
      - postgres
      - mongodb
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  superset_home:
  hop_config:
  hop_audit: